# Agent2 (MiMo) 配置 - 黑方
agent:
  name: "Agent2"
  color: "Black"
  description: "MiMo-V2.6-Flash powered player"
  system_prompt_file: "prompts/agent_default.txt"
  max_retries: 3
  retry_delay: 2
  use_tools: false
  use_reflection: false

llm:
  provider: "mimo"
  model: "mimo-v2.6-flash"
  api_key: "${MIMO_API_KEY}"
  base_url: "https://api.xiaomimimo.com/v1"
  temperature: 0.7
  max_tokens: 2048
  # 深度求是 thinking model：开着思维链会吃光 max_tokens，content 返回空，
  # 走步只能从截断的思考里正则刨（docs/skill-mode-design.md F-017/F-018）。
  # 实测关闭后 7.4s/手、content 必非空、走步合法；开启则 58-130s/手 且可能截断。
  thinking: false
  timeout: 60
