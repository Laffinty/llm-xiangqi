name: Release

# 触发条件：
#   push 到 main 且测试全绿 → 自动递增版本号 → 打 tag → 打 zip → 发 Release
#   手动触发（workflow_dispatch）→ 可指定版本号；留空则同样自动递增
#
# 设计要点（每一条都对应一个具体踩过的坑）：
#   1. **测试是前置门禁**：测试不过就不打 tag，避免发布坏版本。
#   2. **concurrency 防撞号**：两次推送同时跑时串行化，否则会算出相同的版本号。
#   3. **tag 存在即跳过**：tag 已被别人创建（网络重试等）时不失败，直接用既有的。
#   4. **打包脚本自带密钥扫描**：即使 .gitignore 漏了，包里也不会有密钥。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则自动递增）'
        required: false
        type: string

# 同一分支的发布串行化——否则并发推送会算出同一个版本号
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # 创建 tag 与 Release 所需

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 需要完整 tag 历史来算下一个版本号

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---------- 门禁 1：测试必须全绿才允许发布 ----------
      - name: 运行测试
        run: pytest tests -q

      # ---------- 门禁 2：密钥绝不入库/入包 ----------
      - name: 密钥泄露检查
        run: |
          python -m pytest tests/test_no_secret_leak.py -v

      # ---------- 决定版本号 ----------
      - name: 解析版本号
        id: version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            # 允许用户写 v0.1.0 或 0.1.0，统一去掉前缀
            VERSION="${VERSION#v}"
            echo "使用手动指定版本: v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "manual=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 取最新的 v*.*.* tag。--sort=-v:refname 按版本号降序（不是字典序）
          LAST="$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1 || true)"
          echo "最新 tag: ${LAST:-（无）}" >> "$GITHUB_OUTPUT"

          if [ -z "$LAST" ]; then
            VERSION="0.1.0"
          else
            CORE="${LAST#v}"                       # 0.1.3
            MAJOR="${CORE%%.*}"                    # 0
            REST="${CORE#*.}"                     # 1.3
            MINOR="${REST%%.*}"                   # 1
            PATCH="${REST#*.}"                    # 3
            PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "递增后版本: v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "manual=false" >> "$GITHUB_OUTPUT"

      # ---------- 打包 ----------
      - name: 打包
        id: pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/package.sh
          mkdir -p dist
          .github/scripts/package.sh dist "$VERSION"
          echo "archive=dist/llm-xiangqi-${VERSION}.zip" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # ---------- 创建并推送 tag ----------
      - name: 创建并推送 tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag $TAG 已存在，跳过创建（幂等）"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release ${TAG}"
          # 推送 tag 失败（可能已被并发创建）不应让整个 job 失败——
          # 后续 Release 步骤用 tag 的 ref，照样能发布。
          git push origin "$TAG" || echo "tag 推送失败（可能已存在），继续"
          echo "已创建并推送 tag: $TAG"

      # ---------- 发布 Release ----------
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        with:
          name: v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.pack.outputs.archive }}
          body: |
            ## llm-xiangqi ${{ steps.version.outputs.version }}

            自动发布（commit `${{ github.sha }}`）。

            ### 安装

            ```bash
            unzip llm-xiangqi-${{ steps.version.outputs.version }}.zip
            cd llm-xiangqi-${{ steps.version.outputs.version }}
            pip install -r requirements.txt
            ```

            ### 配置密钥

            编辑 `config/agent1_config.yaml` / `config/agent2_config.yaml`，
            把 `${DEEPSEEK_API_KEY}` / `${MIMO_API_KEY}` 换成真实密钥，或设置为同名环境变量。
            **密钥不要写进本仓库。**

            ### 运行

            ```bash
            python game.py --turns 40      # 完整对局（含 Web 界面）
            ```

            Web 界面默认在 <http://localhost:8080>。

            ### 包内容

            仅运行必需：`src/` `config/` `prompts/` `skills/` 与入口脚本。
            不含 `tests/`、`docs/`、`web_3d_client/`。